# Included in every location: an `add_header` inside a location drops all inherited ones.
# HSTS is left to the TLS-terminating proxy (Coolify/Traefik).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Minimal CSP that can't break inline theme/JSON-LD scripts or GSAP inline styles.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
