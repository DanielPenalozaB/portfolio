worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets (JS, CSS, images) for 1 year
    location /_astro/ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Cache fonts
    location /fonts/ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Un-hashed public assets (tool icons, OG/illustration images): long-lived but not
    # immutable, since their URLs don't change when the file does.
    location ~ ^/(icons|images)/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    # Clean URLs — try file, then directory index, then 404.
    # HTML revalidates on every visit so deploys show up immediately.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      include /etc/nginx/security-headers.conf;
      internal;
    }
  }
}
